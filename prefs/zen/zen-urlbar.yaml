- name: zen.urlbar.replace-newtab
  value: true

- name: zen.urlbar.show-protections-icon
  value: false

- name: zen.urlbar.show-contextual-id
  value: false

- name: zen.urlbar.behavior
  value: sidebar

- name: zen.urlbar.wait-to-clear
  value: 45000

- name: zen.urlbar.show-domain-only-in-sidebar
  value: true

- name: zen.urlbar.hide-one-offs
  value: true

- name: zen.urlbar.enable-overrides
  value: false

- name: zen.urlbar.single-toolbar-show-copy-url
  value: true

- name: zen.urlbar.show-pip-button
  value: false

- name: zen.urlbar.open-on-startup
  value: true

# Mark: Zen suggestions controls

- name: zen.urlbar.suggestions.quick-actions
  value: true

- name: browser.urlbar.shortcuts.workspaces
  value: true
- name: zen.urlbar.disable-breakout
  value: false


# Mark: Sidebar results list

- name: zen.urlbar.sidebar.max-rows
  value: 8

- name: zen.urlbar.sidebar.group-by-site
  value: true

- name: zen.urlbar.sidebar.show-paths
  value: true

- name: zen.urlbar.sidebar.max-paths
  value: 3

- name: zen.urlbar.sidebar.show-url
  value: true

- name: zen.urlbar.sidebar.show-source
  value: true

- name: zen.urlbar.sidebar.density
  value: comfortable

# Focused field and results float out over the page instead of widening the
# sidebar: no relayout of the tab list while it opens.
- name: zen.urlbar.sidebar.overlay
  value: true
