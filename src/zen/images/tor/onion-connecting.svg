<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="bulb"
      d="M12 4.4C12 4.4 19.6 9.6 19.6 13.8A7.6 7.6 0 0 1 4.4 13.8C4.4 9.6 12 4.4 12 4.4Z"/>
  </defs>

  <style type="text/css"><![CDATA[
    /* transform and opacity only, about the bulb's centre in user units:
       nothing here can invalidate layout or force a repaint of the chrome. */
    .pulse {
      transform-box: view-box;
      transform-origin: 12px 13.8px;
      animation: zen-tor-pulse 1.8s cubic-bezier(0.35, 0, 0.35, 1) infinite;
      will-change: transform, opacity;
    }
    .pulse-2 { animation-delay: -0.9s; }

    @keyframes zen-tor-pulse {
      0%   { transform: scale(0.3); opacity: 0; }
      25%  { opacity: 1; }
      70%  { opacity: 0.6; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* Reduced motion keeps the icon and drops the travel: the still layer
       takes over so the shape still reads as an onion, not a bare ring. */
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
      .still { opacity: 1; }
    }
  ]]></style>

  <g fill="none" stroke="context-fill" stroke-width="2.25"
     stroke-linejoin="round" stroke-linecap="round">
    <use href="#bulb" opacity="0.4"/>
    <use class="still" href="#bulb" opacity="0" stroke-width="4.33"
         transform="translate(12 13.8) scale(0.52) translate(-12 -13.8)"/>
    <g class="pulse pulse-1"><use href="#bulb"/></g>
    <g class="pulse pulse-2"><use href="#bulb"/></g>
    <path d="M12 4.6C12 3.2 11.1 2.4 9.9 2.1" opacity="0.4"/>
  </g>
</svg>
