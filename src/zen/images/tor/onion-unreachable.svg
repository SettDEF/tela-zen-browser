<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="bulb"
      d="M12 4.4C12 4.4 19.6 9.6 19.6 13.8A7.6 7.6 0 0 1 4.4 13.8C4.4 9.6 12 4.4 12 4.4Z"/>
    <!-- The onion is cut away along the slash rather than crossed by it, so
         the bar stays a bar at 16px instead of merging with the outline. -->
    <mask id="cut">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M20.1 3.9 3.9 20.1" stroke="#000" stroke-width="3.8" stroke-linecap="round"/>
    </mask>
  </defs>

  <g fill="none" stroke="context-fill" stroke-width="2.25"
     stroke-linejoin="round" stroke-linecap="round" mask="url(#cut)">
    <use href="#bulb"/>
    <use href="#bulb" stroke-width="4.33"
         transform="translate(12 13.8) scale(0.52) translate(-12 -13.8)"/>
    <path d="M12 4.6C12 3.2 11.1 2.4 9.9 2.1"/>
  </g>
  <path d="M19.3 4.7 4.7 19.3"
        fill="none" stroke="context-fill" stroke-width="2" stroke-linecap="round"/>
</svg>
