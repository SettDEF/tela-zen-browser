<toolbar id="zen-page-cards-toolbar"
  class="browser-toolbar zen-sidebar-toolbar"
  context="toolbar-context-menu"
  mode="icons"
  hidden="true">
  <html:template id="zen-page-card-template">
    <toolbaritem class="zen-page-card zen-stack-card">
      <vbox class="zen-page-card-main">
        <hbox class="zen-page-card-header">
          <vbox class="zen-page-card-titles">
            <label class="zen-page-card-title"/>
            <label class="zen-page-card-subtitle"/>
          </vbox>
          <toolbarbutton class="zen-page-card-close toolbarbutton-1"/>
        </hbox>
        <vbox class="zen-page-card-items"/>
      </vbox>
    </toolbaritem>
  </html:template>
</toolbar>
