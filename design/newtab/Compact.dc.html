      <div class="s" style="font-size: 26px; line-height: 1.15; flex: 1 1 auto; text-wrap: pretty">
        Affenkäfig — Veranstaltungen im September

    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 7px;
                  background: #161616; border: 1px solid rgba(255,255,255,0.08)">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: {{accent}}; flex: 0 0 auto"></span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">

        <span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.14); flex: 0 0 auto"></span>

        <span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.14); flex: 0 0 auto"></span>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#a9b4d1","options":["#a9b4d1","#bed1a9","#d1a9c8","#d1c5a9"]},"$preview":{"width":1440,"height":720}}'>
